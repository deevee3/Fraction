[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Pinned compiler for reproducible, reviewable builds.
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

# Remappings for dependencies.
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/"
]

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
